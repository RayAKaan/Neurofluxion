name: Neurofluxion cross-platform trace benchmark

on:
  pull_request:
    paths:
      - "research/experiments/run_trace_benchmark.py"
      - "research/CROSS_PLATFORM_BENCHMARK.md"
      - ".github/workflows/cross-platform-trace-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NumPy
        run: python -m pip install --upgrade pip numpy
      - name: Run benchmark with raw samples
        env:
          PYTHONPATH: backend
        run: |
          python research/experiments/run_trace_benchmark.py --repo . --out research/artifacts/trace-benchmark-${{ runner.os }}.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-benchmark-${{ runner.os }}-py${{ matrix.python-version }}
          path: research/artifacts/trace-benchmark-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
