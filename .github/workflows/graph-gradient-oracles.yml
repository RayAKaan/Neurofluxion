name: Neurofluxion graph-integrated gradient oracles

on:
  pull_request:
    paths:
      - "backend/tests/test_research_graph_gradient_oracles.py"
      - "backend/simulator/**"
      - ".github/workflows/graph-gradient-oracles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-difference-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run graph-integrated finite-difference tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_research_graph_gradient_oracles.py -q
