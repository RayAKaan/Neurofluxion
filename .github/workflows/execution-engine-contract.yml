name: Execution engine numerical contracts

on:
  pull_request:
    paths:
      - "backend/simulator/execution_engine.py"
      - "backend/api/execute_routes.py"
      - "backend/tests/test_execution_engine_numerics.py"
      - ".github/workflows/execution-engine-contract.yml"

permissions:
  contents: read

jobs:
  execution-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest fastapi
      - name: Run execution engine contracts
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_execution_engine_numerics.py -q

  full-backend-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx2
      - name: Run backend suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
