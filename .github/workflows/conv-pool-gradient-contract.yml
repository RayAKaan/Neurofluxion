name: Conv2D and pooling numerical contracts

on:
  pull_request:
    paths:
      - "backend/simulator/layers/conv2d.py"
      - "backend/simulator/layers/im2col.py"
      - "backend/simulator/layers/pooling.py"
      - "backend/tests/test_conv_pool_gradient_contract.py"
      - ".github/workflows/conv-pool-gradient-contract.yml"

permissions:
  contents: read

jobs:
  conv-pool-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run Conv2D/pooling and simulator smoke tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest
          backend/tests/test_conv_pool_gradient_contract.py
          backend/tests/test_simulator_smoke.py
          -q
