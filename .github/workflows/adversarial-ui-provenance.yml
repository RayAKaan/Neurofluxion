name: Neurofluxion adversarial UI provenance tests

on:
  pull_request:
    paths:
      - "frontend/e2e/stale-forward-provenance.spec.mjs"
      - "frontend/src/store/**"
      - "frontend/src/components/tabs/RunInspectTab.tsx"
      - "frontend/src/pages/SimulatorPage.tsx"
      - "backend/api/simulator_routes.py"
      - ".github/workflows/adversarial-ui-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx2
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start services and run adversarial browser test
        env:
          PYTHONPATH: backend
        run: |
          (cd backend && PYTHONPATH=. python -m uvicorn app:app --host 127.0.0.1 --port 8000) >/tmp/neurofluxion-backend.log 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) >/tmp/neurofluxion-frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/models/available >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Services did not become ready."
              cat /tmp/neurofluxion-backend.log
              cat /tmp/neurofluxion-frontend.log
              exit 1
            fi
            sleep 2
          done
          cd frontend
          npx playwright test --config=playwright.config.mjs e2e/stale-forward-provenance.spec.mjs
      - name: Upload browser traces on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofluxion-adversarial-browser-report
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 30
