name: Neurofluxion BatchNorm graph-gradient oracle

on:
  pull_request:
    paths:
      - "backend/tests/test_research_batchnorm_graph_gradient_oracle.py"
      - "backend/simulator/**"
      - ".github/workflows/batchnorm-graph-gradient-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batchnorm-graph-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run BatchNorm graph-gradient oracle
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_research_batchnorm_graph_gradient_oracle.py -q
