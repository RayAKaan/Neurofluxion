name: Neurofluxion frozen-main integrated validation

on:
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/frozen-main-integrated-validation.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact source revision to validate (defaults to the selected workflow revision)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Record source and environment
        run: |
          git rev-parse HEAD | tee /tmp/source-sha.txt
          python --version
          python -m pip --version
          uname -a
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx2
      - name: Run full backend suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Upload source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-validation-source
          path: /tmp/source-sha.txt
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx2
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start services and run browser E2E
        env:
          PYTHONPATH: backend
        run: |
          (cd backend && PYTHONPATH=. python -m uvicorn app:app --host 127.0.0.1 --port 8000) >/tmp/neurofluxion-backend.log 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) >/tmp/neurofluxion-frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/models/available >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Services did not become ready."
              cat /tmp/neurofluxion-backend.log
              cat /tmp/neurofluxion-frontend.log
              exit 1
            fi
            sleep 2
          done
          cd frontend
          npx playwright test --config=playwright.config.mjs
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-validation-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run deterministic dense-path research audit
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p research/artifacts
          python research/experiments/run_simulator_audit.py --repo . --out research/artifacts/simulator-audit.json
      - name: Upload research evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-validation-research-audit
          path: research/artifacts/simulator-audit.json
          if-no-files-found: warn
          retention-days: 30
