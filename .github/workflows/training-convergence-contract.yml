name: Neurofluxion training convergence contracts

on:
  pull_request:
    paths:
      - "backend/simulator/training_engine.py"
      - "backend/simulator/optimizer_engine.py"
      - "backend/tests/test_training_convergence_contract.py"
      - ".github/workflows/training-convergence-contract.yml"

permissions:
  contents: read

jobs:
  training-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal numerical test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run gradient, BCE, convergence, and optimizer contracts
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest
          backend/tests/test_simulator_mse_gradient_contract.py
          backend/tests/test_training_mse_gradient_contract.py
          backend/tests/test_bce_gradient_contract.py
          backend/tests/test_training_convergence_contract.py
          -q
