name: Neurofluxion embedding-attention recurrent training contracts

on:
  pull_request:
    paths:
      - "backend/tests/test_research_embedding_attention_graph_training.py"
      - "backend/simulator/training_engine.py"
      - ".github/workflows/embedding-attention-graph-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding-attention-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run embedding-attention training contract
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_research_embedding_attention_graph_training.py -q
