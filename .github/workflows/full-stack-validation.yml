name: Neurofluxion full-stack validation

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/full-stack-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx2
      - name: Run backend test suite (heavy inference opt-in remains disabled)
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend (TypeScript and Vite)
        working-directory: frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx2
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start services and run browser E2E
        env:
          PYTHONPATH: backend
        run: |
          (cd backend && PYTHONPATH=. python -m uvicorn app:app --host 127.0.0.1 --port 8000) >/tmp/neurofluxion-backend.log 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) >/tmp/neurofluxion-frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/models/available >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Services did not become ready."
              cat /tmp/neurofluxion-backend.log
              cat /tmp/neurofluxion-frontend.log
              exit 1
            fi
            sleep 2
          done
          cd frontend
          npx playwright test --config=playwright.config.mjs
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neurofluxion-playwright-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
